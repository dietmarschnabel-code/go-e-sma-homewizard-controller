<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="title">Solar Energy Dashboard</title> <!--[cite: 3] -->
    
    <!-- PWA Manifest & Full-Screen Settings -->
    <link rel="manifest" href="manifest.json"> <!--[cite: 3] -->
    <meta name="theme-color" content="#000000"> <!--[cite: 3] -->
    
    <!-- iOS / Safari Full-Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes"> <!--[cite: 3] -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!--[cite: 3] -->
    <meta name="apple-mobile-web-app-title" content="SolarDash"> <!--[cite: 3] -->

    <link rel="stylesheet" href="styles.css"> <!--[cite: 3] -->
    <link rel="shortcut icon" href="/pv/favicon.ico" type="image/x-icon" /> <!--[cite: 3] -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!--[cite: 3] -->
</head>
<body>

    <div class="dashboard-container"> <!--[cite: 3] -->
        <!-- Header & Controls -->
        <header class="dashboard-header"> <!--[cite: 3] -->
            <h1 data-i18n="title">Solar Energy Dashboard</h1> <!--[cite: 3] -->
            
            <div class="header-controls"> <!--[cite: 3] -->
                <div class="view-toggle"> <!--[cite: 3] -->
                    <button id="btn-daily" class="toggle-btn active" onclick="switchView('daily')" data-i18n="daily">Daily</button> <!--[cite: 3] -->
                    <button id="btn-monthly" class="toggle-btn" onclick="switchView('monthly')" data-i18n="monthly">Monthly</button> <!--[cite: 3] -->
                    <button id="btn-yearly" class="toggle-btn" onclick="switchView('yearly')" data-i18n="yearly">Yearly</button> <!--[cite: 3] -->
                    <button id="btn-status" class="toggle-btn" onclick="toggleStatusModal()" data-i18n="systemStatusBtn">ℹ️ Status</button>
                </div>
                
                <div class="date-picker-container"> <!--[cite: 3] -->
                    <input type="date" id="date-select" class="picker-input"> <!--[cite: 3] -->
                    <input type="month" id="month-select" class="picker-input hidden"> <!--[cite: 3] -->
                    <select id="year-select" class="picker-input hidden"></select> <!--[cite: 3] -->
                </div>
            </div>
        </header>

        <!-- KPI Cards Grid -->
        <div class="kpi-grid"> <!--[cite: 3] -->
            <div class="card"> <!--[cite: 3] -->
                <h3 id="kpi-pv-title" data-i18n="pvGen">PV Generation</h3> <!--[cite: 3] -->
                <p id="pv-metric" class="metric-value">0 W</p> <!--[cite: 3] -->
            </div>
            
            <div class="card"> <!--[cite: 3] -->
                <h3 id="kpi-grid-title" data-i18n="gridPower">Grid Active Power</h3> <!--[cite: 3] -->
                <p id="grid-metric" class="metric-value">0 W</p> <!--[cite: 3] -->
                <p id="grid-status" class="status-text" data-i18n="loading">Loading...</p> <!--[cite: 3] -->
            </div>
            
            <div class="card"> <!--[cite: 3] -->
                <h3 id="kpi-import-title" data-i18n="importToday">Import Today</h3> <!--[cite: 3] -->
                <p id="import-metric" class="metric-value">0.0 kWh</p> <!--[cite: 3] -->
            </div>
            
            <div class="card"> <!--[cite: 3] -->
                <h3 id="kpi-export-title" data-i18n="exportToday">Export Today</h3> <!--[cite: 3] -->
                <p id="export-metric" class="metric-value">0.0 kWh</p> <!--[cite: 3] -->
            </div>
        </div>

        <!-- Chart Section -->
        <div class="chart-section card"> <!--[cite: 3] -->
            <div class="chart-container"> <!--[cite: 3] -->
                <canvas id="energyChart"></canvas> <!--[cite: 3] -->
            </div>
        </div>
    </div>

    <!-- Status Modal Popup -->
    <div id="status-modal" class="modal hidden">
        <div class="modal-content card">
            <div class="modal-header">
                <h2 data-i18n="systemStatus">System Status</h2>
                <button class="close-btn" onclick="toggleStatusModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="status-row">
                    <span data-i18n="localTime">Lokale Uhrzeit:</span>
                    <strong id="status-clock">--:--:--</strong>
                </div>
                <div class="status-row">
                    <span data-i18n="operatingDays">Laufzeit Anlage:</span>
                    <strong id="status-days">0 Tage</strong>
                </div>
                <hr class="modal-divider">
                <div class="status-row">
                    <span data-i18n="totalPvGen">Gesamterzeugung PV:</span>
                    <strong id="status-pv-total">0 kWh</strong>
                </div>
                <div class="status-row">
                    <span data-i18n="totalImport">Gesamt Netzbezug:</span>
                    <strong id="status-import-total">0 kWh</strong>
                </div>
                <div class="status-row">
                    <span data-i18n="totalExport">Gesamt Einspeisung:</span>
                    <strong id="status-export-total">0 kWh</strong>
                </div>
            </div>
        </div>
    </div>

    <!-- Internationalization Script (Loaded First) -->
    <script src="i18n.js"></script> <!--[cite: 3] -->
    
    <!-- DATA SCRIPTS -->
    <script src="pv.js"></script> <!--[cite: 3] -->
    <script src="p1.js"></script> <!--[cite: 3] -->
    
    <!-- App Logic -->
    <script src="app.js"></script> <!--[cite: 3] -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('SW Error:', err));
    }
    </script> <!--[cite: 3] -->
</body>
</html>
