<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Background Fill for Adaptive Masking -->
  <rect width="512" height="512" fill="#0f172a" />
  
  <!-- Centered Solar Panel Icon within Safe Zone -->
  <g transform="translate(96, 96) scale(0.625)">
    <rect x="40" y="20" width="432" height="472" rx="16" fill="#000000" transform="rotate(10 256 256)" />
    <rect x="56" y="36" width="400" height="440" rx="8" fill="#ffffff" transform="rotate(10 256 256)" />
    
    <!-- Solar Cells Grid -->
    <g transform="rotate(10 256 256)" fill="#76b900">
      <rect x="90"  y="70"  width="80" height="100" rx="16" />
      <rect x="216" y="70"  width="80" height="100" rx="16" />
      <rect x="342" y="70"  width="80" height="100" rx="16" />
      
      <rect x="90"  y="206" width="80" height="100" rx="16" />
      <rect x="216" y="206" width="80" height="100" rx="16" />
      <rect x="342" y="206" width="80" height="100" rx="16" />
      
      <rect x="90"  y="342" width="80" height="100" rx="16" />
      <rect x="216" y="342" width="80" height="100" rx="16" />
      <rect x="342" y="342" width="80" height="100" rx="16" />
    </g>
  </g>
</svg>
