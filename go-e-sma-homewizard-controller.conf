# go-e-sma-homewizard-controller Configuration File
#
# This file should be placed in one of these locations:
#   - /etc/go-e-sma-homewizard-controller/go-e-sma-homewizard-controller.conf (system-wide)
#   - $HOME/.config/go-e-sma-homewizard-controller/go-e-sma-homewizard-controller.conf (user-specific)
#   - Same directory as the script (local config)
#
# Format: KEY=VALUE (no spaces around '=' recommended)
# Lines starting with # are comments and are ignored.
# Empty lines are ignored.
#
# The script searches for the config file in the order listed above and uses the first one found.
# Environment variables can override these settings:
#   - CHARGER_IP_ENV
#   - P1_IP_ENV
#   - MAX_POWER_LIMIT_WATTS_ENV
#   - SAFETY_MARGIN_WATTS_ENV

# IP address of your go-e-charger
# Example: 192.168.1.100
CHARGER_IP=#.#.#.#

# IP address of your HomeWizard P1 Meter
# Example: 192.168.1.101
P1_IP=#.#.#.#

# Maximum power limit in Watts
# This prevents exceeding the power threshold (especially for Austrian >10kW tariff)
# Default: 10000 (10 kW)
MAX_POWER_LIMIT_WATTS=10000

# Safety margin in Watts
# Buffer to avoid short-term power fluctuations causing issues
# Default: 300
SAFETY_MARGIN_WATTS=300
