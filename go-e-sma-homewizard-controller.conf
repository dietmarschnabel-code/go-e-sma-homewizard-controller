# go-e-sma-homewizard-controller Configuration File
#
# File locations searched sequentially:
#   - /etc/go-e-sma-homewizard-controller/go-e-sma-homewizard-controller.conf
#   - $HOME/.config/go-e-sma-homewizard-controller/go-e-sma-homewizard-controller.conf
#   - Local execution directory
#
# Environment variables override options set in this file:
#   CHARGER_IP, P1_IP, MAX_POWER_LIMIT_WATTS, SAFETY_MARGIN_WATTS,
#   PV_PHASE_MODE, SMA_LOG_FILE, P1_CSV_FILE, LATITUDE, LONGITUDE

# IP address of your go-eCharger
# Example: 192.168.1.50
CHARGER_IP=192.168.1.50

# IP address of your HomeWizard P1 Meter
# Example: 192.168.1.60
P1_IP=192.168.1.60

# Maximum power limit in Watts
# Prevents exceeding peak load thresholds (e.g., Austrian >10 kW grid tariff limits)
# Default: 10000 (10 kW)
MAX_POWER_LIMIT_WATTS=10000

# Safety margin in Watts
# Subtracted from MAX_POWER_LIMIT_WATTS to provide a buffer against sudden household load spikes
# Default: 300
SAFETY_MARGIN_WATTS=300

# Phase mode control for PV charging (maps to 'psm' parameter on go-eCharger):
#  -1 = Disabled / Do not touch phase mode (DEFAULT)
#       Preserves manual user phase selections and leaves phase switching untouched.
#   0 = Auto / 3-phase allowed
#       Enforces automatic phase switching (1-phase / 3-phase).
#   1 = Force 1-phase mode
#       Locks charging to single-phase to maximize PV self-consumption on small solar setups.
# Default: -1
PV_PHASE_MODE=-1

# Path to the SMA inverter log file used for PV generation power detection
# Leave empty to skip PV power reading while continuing grid load management and charger updates
# Default: /var/lib/sma-bluetooth/tmp/sma-update.log
SMA_LOG_FILE=/var/lib/sma-bluetooth/tmp/sma-update.log

# Path for P1 Meter CSV logging (records 5-minute raw interval data and daily monthly summaries)
# Leave empty or commented out to disable CSV logging
# Default: disabled
# P1_CSV_FILE=/var/www/html/p1/p1_data.csv
